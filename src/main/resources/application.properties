spring.application.name=payment_service
server.port=${SERVER_PORT:8084}

# Datasource (override with environment variables outside local development)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/elurea_payment_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Pagination
spring.data.web.pageable.max-page-size=100

# Errors: never leak stack traces or exception messages to clients
server.error.include-stacktrace=never
server.error.include-message=never

# --- Application settings ---

# JWT issued by the user service: secret and issuer MUST match the user service configuration.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
app.jwt.issuer=elurea-user-service

# Browser origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Order service, and the shared service-to-service key (same INTERNAL_API_KEY in every service)
app.services.order-url=${ORDER_SERVICE_URL:http://localhost:8083}
app.services.internal-api-key=${INTERNAL_API_KEY:local-dev-internal-key}
app.services.connect-timeout=2s
app.services.read-timeout=5s

# Payment provider: "sandbox" (simulated, for development and demos) or "paypal".
app.payments.provider=${PAYMENT_PROVIDER:sandbox}
# Currency of the shop's prices (the order totals).
app.payments.currency=${PAYMENT_CURRENCY:MAD}

# PayPal only. Credentials of a REST app from https://developer.paypal.com (sandbox or live).
app.payments.paypal.client-id=${PAYPAL_CLIENT_ID:}
app.payments.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
app.payments.paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
# https://api-m.sandbox.paypal.com for testing, https://api-m.paypal.com for real payments.
app.payments.paypal.api-url=${PAYPAL_API_URL:https://api-m.sandbox.paypal.com}
# PayPal does not support MAD: payments are charged in this currency, converted with the rate below
# (value of 1 MAD in that currency, e.g. 0.092 for EUR). Required when it differs from the shop currency.
app.payments.paypal.currency=${PAYPAL_CURRENCY:EUR}
app.payments.paypal.exchange-rate=${PAYPAL_EXCHANGE_RATE:}
# Frontend pages the buyer returns to after approving or cancelling on PayPal (redirect flow).
app.payments.paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:3000/checkout/paypal/return}
app.payments.paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:3000/checkout/paypal/cancel}
